name: Java SDK preview

on:
  push:
    branches:
      - java/sdk-preview
    tags:
      - java-sdk-v0.1.0-preview.*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Java 17 SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: sdk_v2/java/pom.xml

      - name: Resolve immutable preview version
        id: version
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $expectedTag = "java-sdk-v0.1.0-preview.1-$shortSha"
            if ($env:GITHUB_REF_NAME -ne $expectedTag) {
              throw "Expected tag $expectedTag for source commit $env:GITHUB_SHA."
            }
            $version = $env:GITHUB_REF_NAME.Substring('java-sdk-v'.Length)
          } else {
            $version = "0.1.0-preview.0-$shortSha"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and test SDK
        shell: pwsh
        run: |
          mvn --batch-mode --no-transfer-progress `
            -f sdk_v2/java/pom.xml `
            "-Drevision=${{ steps.version.outputs.version }}" `
            clean verify
          if ($LASTEXITCODE -ne 0) {
            throw "Maven exited with $LASTEXITCODE."
          }

      - name: Verify preview JAR
        id: artifact
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $target = Join-Path $env:GITHUB_WORKSPACE 'sdk_v2/java/target'
          $jar = Join-Path $target "foundry-local-sdk-$version.jar"
          if (-not (Test-Path -LiteralPath $jar -PathType Leaf)) {
            throw "Missing expected preview JAR: $jar"
          }

          $mainJars = @(Get-ChildItem -LiteralPath $target -Filter '*.jar' |
            Where-Object { $_.Name -notlike '*-sources.jar' })
          if ($mainJars.Count -ne 1 -or $mainJars[0].FullName -ne $jar) {
            throw "The build must produce exactly one first-party SDK JAR."
          }

          $entries = @(& jar tf $jar)
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect $jar."
          }
          if ($entries | Where-Object {
              $_ -like 'com/sun/jna/*' -or $_ -like 'com/google/gson/*'
            }) {
            throw "The preview SDK JAR must not embed JNA or Gson classes."
          }

          $file = Get-Item -LiteralPath $jar
          $sha256 = (Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash.ToLowerInvariant()
          "jar=$jar" >> $env:GITHUB_OUTPUT
          "filename=$($file.Name)" >> $env:GITHUB_OUTPUT
          "bytes=$($file.Length)" >> $env:GITHUB_OUTPUT
          "sha256=$sha256" >> $env:GITHUB_OUTPUT

          @"
          ### Java SDK preview

          - Version: ``$version``
          - File: ``$($file.Name)``
          - Bytes: ``$($file.Length)``
          - SHA-256: ``$sha256``
          - Source: ``$env:GITHUB_SHA``
          - JDK: ``$(& java -version 2>&1 | Select-Object -First 1)``
          - Build: ``mvn -f sdk_v2/java/pom.xml -Drevision=$version clean verify``
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Upload preview SDK JAR
        uses: actions/upload-artifact@v4
        with:
          name: foundry-local-sdk-${{ steps.version.outputs.version }}
          path: ${{ steps.artifact.outputs.jar }}
          if-no-files-found: error
          retention-days: 90
